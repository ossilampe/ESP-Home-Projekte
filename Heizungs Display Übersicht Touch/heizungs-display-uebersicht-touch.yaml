    id: s_ak_temp
    entity_id: sensor.pylontech_battery_id_512_batterietemperatur
    on_value:
      then:
        - lambda: 'hz::num(ak_temp, x, "%.1f °C");'

# Zwei Taster an der Steckleiste: Taster zwischen GPIO und GND (interner Pull-up)
#   Taster 1 = GPIO17 (Leisten-Pin 16), Taster 2 = GPIO18 (Leisten-Pin 18), GND z. B. Pin 30
binary_sensor:
  # Profil Ganztags: an = immer Tag, Abend-Werte und Uhrzeiten gelten nicht
  - platform: homeassistant
    id: bs_ganztags
    entity_id: input_boolean.zirkulation_ganztags
    on_state:
      then:
        - script.execute: profil_zeigen
        - script.execute: grenzen_update
  - platform: gpio
    name: "Taster 1"
    id: taster_1
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
  - platform: gpio
    name: "Taster 2"
    id: taster_2
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

  # Rueckmeldungen der Shelly Decoupler 230V: Ausgang schaltet nach GND (Optokoppler)
  - platform: gpio
    name: "Rückmeldung Rücklaufanhebung P6"
    id: rm_p6
    pin:
      number: GPIO39
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  - platform: gpio
    name: "Rückmeldung Pumpe Gas"
    id: rm_gas
    pin:
      number: GPIO40
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  - platform: gpio
    name: "Rückmeldung Pumpe Kamin"
    id: rm_kamin
    pin:
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  - platform: gpio
    name: "Rückmeldung Dreiwegeventil"
    id: rm_ventil
    pin:
      number: GPIO42
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

text_sensor:
  # Umschaltzeiten der Profile ("06:00:00")
  - platform: homeassistant
    id: ts_tag_ab
    entity_id: input_datetime.zirkulation_tag_ab
    on_value:
      then:
        - script.execute: profil_laden
  - platform: homeassistant
    id: ts_abend_ab
    entity_id: input_datetime.zirkulation_abend_ab
    on_value:
      then:
        - script.execute: profil_laden
  # aktives Schaltprofil der Pumpe Kamin (Tag / Abend), schaltet die HA-Automatisierung
  - platform: homeassistant
    id: ts_profil
    entity_id: input_select.zirkulation_profil
    on_value:
      then:
        - script.execute: grenzen_update
  # Netzwerkdaten fuer die Admin-Seite
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true
    ssid:
      id: wifi_ssid_t
      internal: true
    mac_address:
      id: wifi_mac
      internal: true
  # Schalter aus HA als Text: "on", "off", "unavailable" ...
  - platform: homeassistant
    id: ts_wp
    entity_id: switch.warmepumpe
    on_value:
      then:
        - script.execute: bwwp_update

  - platform: homeassistant
    id: ts_stab
    entity_id: switch.bwwp_steuerung_esp_lichtsensor_wp_status_led
    on_value:
      then:
        - lambda: |-
            int z = hz::zustand(x);
            hz::knopf(kn_stab, kn_stab_z, z);
            lv_obj_set_style_text_color(ov_stab, lv_color_hex(z == 1 ? hz::GRUEN : (z == 0 ? hz::ROT : hz::GRAU)), 0);

  - platform: homeassistant
    id: ts_zp_bw
    entity_id: switch.shellyplus_zirkulationspumpe
    on_value:
      then:
        - lambda: 'hz::knopf(kn_zirk, kn_zirk_z, hz::zustand(x));'

  # Warmwasser per Gas zuheizen = Relais am Display Buderus
  - platform: homeassistant
    id: ts_ww_gas
    entity_id: switch.display_buderus_ww_zuheizen
    on_value:
      then:
        - lambda: |-
            int z = hz::zustand(x);
            hz::knopf(kn_gas, kn_gas_z, z);
            if (z == 1) hz::txt(ov_wwgas, "WW zuheizen: EIN", hz::GRUEN);
            else if (z == 0) hz::txt(ov_wwgas, "WW zuheizen: AUS", hz::ROT);
            else hz::txt(ov_wwgas, "WW zuheizen: --", hz::GRAU);
        - if:
            condition:
              lambda: 'return x == "on";'
            then:
              - lvgl.image.update: {id: ov_ww_img, src: bwwp_on}
              - lvgl.image.update: {id: ww_img, src: bwwp_on_g}
            else:
              - lvgl.image.update: {id: ov_ww_img, src: bwwp_off}
              - lvgl.image.update: {id: ww_img, src: bwwp_off_g}

  # Relais "Gas unterdruecken" am Display Buderus: on = Brenner gesperrt (Bild Brenner aus)
  - platform: homeassistant
    id: ts_gas_sperre
    entity_id: switch.display_buderus_gas_unterdruecken
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "on";'
            then:
              - lvgl.image.update: {id: ov_gas_img, src: brenner_off}
            else:
              - lvgl.image.update: {id: ov_gas_img, src: brenner_on}

  - platform: homeassistant
    id: ts_gas_stichtag
    entity_id: input_datetime.gas_stichtag
    on_value:
      then:
        - lambda: |-
            if (x.size() >= 10) {
              std::string d = x.substr(8, 2) + "." + x.substr(5, 2) + "." + x.substr(0, 4);
              lv_label_set_text(gk_stichtag, d.c_str());
            }

  - platform: homeassistant
    id: ts_wr_zustand
    entity_id: sensor.multiplus_ii_1_wechselrichterzustand
    on_value:
      then:
        - lambda: |-
            bool ok = !(x.empty() || x == "unknown" || x == "unavailable");
            hz::txt(so_wr, ok ? x.c_str() : "--", ok ? hz::GRUEN : hz::GRAU);

