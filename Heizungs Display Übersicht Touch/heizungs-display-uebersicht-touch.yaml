  - platform: homeassistant
    id: k_jahr
    entity_id: sensor.gas_kosten_seit_stichtag
    on_value: {then: [script.execute: gas_update]}

  # ---------- Solar ----------
  - platform: homeassistant
    id: pv_leistung
    entity_id: sensor.victron_system_dc_pv_power
    filters:
      - throttle: 5s
    on_value:
      then:
        - lambda: 'hz::num(so_pv, x, "%.0f W");'
  - platform: homeassistant
    id: pv_tag
    entity_id: sensor.gx_device_solar_erzeugung_taglich
    on_value:
      then:
        - lambda: 'hz::num(so_heute, x, "%.1f kWh");'
  - platform: homeassistant
    id: sens_wr1_p
    entity_id: sensor.multiplus_ii_1_wechselrichter_ausgangsleistung_l1
    filters:
      - throttle: 5s
    on_value:
      then:
        - lambda: 'hz::num(so_l1, x, "%.0f W");'
        - script.execute: solar_update
  - platform: homeassistant
    id: sens_wr2_p
