lvgl:
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touch
  rotation: 90
  buffer_size: 25%   # Zeichenpuffer im schnellen internen RAM

  # Nach 30 s ohne Beruehrung: zurueck auf die Uebersicht, Beleuchtung aus, LVGL anhalten
  on_idle:
    timeout: 30s
    then:
      - lvgl.widget.hide: dlg
      - lvgl.page.show: seite_1
      - light.turn_off: display_backlight
      - lvgl.pause:

  theme:
    dark_mode: true
    label:
      text_color: 0xFFFFFF
  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER
  text_color: 0xFFFFFF
  text_font: f20

  style_definitions:
    - id: st_kachel
      bg_color: 0x1F1F1F
      bg_opa: COVER
      radius: 10
      border_width: 0
      pad_all: 0
    - id: st_klein
      text_font: f18
      text_color: 0x8C8C8C
    - id: st_zeile
      text_font: f20
      text_color: 0xFFFFFF
    - id: st_knopf
      bg_color: 0x1F1F1F
      bg_opa: COVER
      radius: 10
      border_width: 3
      border_color: 0x8C8C8C
      shadow_width: 0
      pad_all: 0
    - id: st_nav
      bg_color: 0x1F1F1F
      bg_opa: COVER
      radius: 10
      border_width: 0
      shadow_width: 0

  # Kopfzeile (WLAN + Uhrzeit) und Blaettern unten liegen ueber allen Seiten
  top_layer:
    widgets:
      - image:
          x: 6
          y: 5
          src: wlan
      - label:
          id: hdr_wlan
          x: 30
          y: 4
          text: "--"
          text_font: f18
      - label:
          id: hdr_titel
          x: 100
          y: 3
          width: 280
          text_align: CENTER
          text: "Übersicht"
          text_font: f20
          text_color: 0x00EDED
      - label:
          id: hdr_zeit
          x: 386
          y: 4
          width: 90
          text_align: RIGHT
          text: "--:--"
          text_font: f18
      - obj:
          x: 0
          y: 30
          width: 480
          height: 2
          bg_color: 0x00EDED
          bg_opa: COVER
          radius: 0
          border_width: 0
          clickable: false
      - button:
          id: nav_zurueck
          x: 14
          y: 278
          width: 110
          height: 40
          styles: st_nav
          on_click:
            - lvgl.page.previous:
                animation: NONE
          widgets:
            - label:
                align: CENTER
                text: "<"
                text_font: f26
                text_color: 0x8C8C8C
      # Home: zurueck zur Uebersicht, zeigt gleichzeitig die Seitenzahl
      - button:
          id: nav_home
          x: 175
          y: 278
          width: 130
          height: 40
          styles: st_nav
          on_click:
            - lvgl.page.show:
                id: seite_1
                animation: NONE
          widgets:
            - label:
                align: LEFT_MID
                x: 16
                text: ""
                text_font: montserrat_20
                text_color: 0x00EDED
            - label:
                id: nav_seite
                align: RIGHT_MID
                x: -14
                text: "1 / 6"
                text_font: f18
                text_color: 0x8C8C8C
      - button:
          id: nav_weiter
          x: 366
          y: 278
          width: 110
          height: 40
          styles: st_nav
          on_click:
            - lvgl.page.next:
                animation: NONE
          widgets:
            - label:
                align: CENTER
                text: ">"
                text_font: f26
                text_color: 0x8C8C8C
      # Nachfrage vor dem Schalten und Speichern (liegt ueber allen Seiten)
      - obj:
          id: dlg
          x: 0
          y: 0
          width: 480
          height: 320
          bg_color: 0x000000
          bg_opa: 80%
          radius: 0
          border_width: 0
          pad_all: 0
          scrollable: false
          hidden: true
          widgets:
            - obj:
                align: CENTER
                width: 380
                height: 200
                bg_color: 0x1F1F1F
                bg_opa: COVER
                radius: 12
                border_width: 3
                border_color: 0x00FF00
                pad_all: 0
                scrollable: false
                widgets:
                  - label: {id: dlg_text, align: TOP_MID, y: 20, width: 340, text_align: CENTER, text: "", text_font: f26}
                  - button:
                      x: 24
                      y: 120
                      width: 150
                      height: 56
                      styles: st_knopf
                      border_color: 0x00FF00
                      on_click:
                        - if:
                            condition:
                              lambda: 'return id(frage_aktion) == 1;'
                            then:
                              - homeassistant.action:
                                  action: switch.toggle
                                  data:
                                    entity_id: switch.display_buderus_ww_zuheizen
                        - if:
                            condition:
                              lambda: 'return id(frage_aktion) == 2;'
                            then:
                              - homeassistant.action:
                                  action: button.press
                                  data:
                                    entity_id: button.bwwp_steuerung_turn_on
                        - if:
                            condition:
                              lambda: 'return id(frage_aktion) == 3;'
                            then:
                              - homeassistant.action:
                                  action: switch.toggle
                                  data:
                                    entity_id: switch.shellyplus_zirkulationspumpe
                        - if:
                            condition:
                              lambda: 'return id(frage_aktion) == 4;'
                            then:
                              - homeassistant.action:
                                  action: input_number.set_value
                                  data:
                                    entity_id: input_number.zirkulation_grenze_t1
                                  data_template:
                                    value: "{{ wert }}"
                                  variables:
                                    wert: 'return id(to_neu);'
                              - homeassistant.action:
                                  action: input_number.set_value
                                  data:
                                    entity_id: input_number.zirkulation_grenze_t2
                                  data_template:
                                    value: "{{ wert }}"
                                  variables:
                                    wert: 'return id(tu_neu);'
                              - homeassistant.action:
                                  action: input_number.set_value
                                  data:
                                    entity_id: input_number.zirkulation_hysterese
                                  data_template:
                                    value: "{{ wert }}"
                                  variables:
                                    wert: 'return id(hy_neu);'
                              - homeassistant.action:
                                  action: input_number.set_value
                                  data:
                                    entity_id: input_number.zirkulation_nachlauf
                                  data_template:
                                    value: "{{ wert }}"
                                  variables:
                                    wert: 'return id(nl_neu);'
                              - lambda: 'id(einst_geaendert) = false;'
                              - script.execute: einst_zeigen
                        - lambda: 'id(frage_aktion) = 0;'
                        - lvgl.widget.hide: dlg
                      widgets:
                        - label: {align: CENTER, text: "Ja", text_font: f26, text_color: 0x00FF00}
                  - button:
                      x: 200
                      y: 120
                      width: 150
                      height: 56
                      styles: st_knopf
                      border_color: 0xFF0000
                      on_click:
                        - lambda: 'id(frage_aktion) = 0;'
                        - lvgl.widget.hide: dlg
                      widgets:
                        - label: {align: CENTER, text: "Nein", text_font: f26, text_color: 0xFF0000}

  pages:
    # =================== 1 Uebersicht (cyan) ===================
    - id: seite_1
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - script.execute: {id: set_seite, n: 1, titel: "Übersicht", farbe: 0x00EDED}
      widgets:
        - obj: {x: 0, y: 32, width: 5, height: 288, bg_color: 0x00EDED, bg_opa: COVER, radius: 0, border_width: 0, clickable: false}
        - obj:
            x: 14
            y: 38
            width: 227
            height: 112
            styles: st_kachel
