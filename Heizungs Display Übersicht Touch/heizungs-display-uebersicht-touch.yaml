# Firmware-Stand fuer die Admin-Seite (bei Aenderungen hochzaehlen)
substitutions:
  fw_version: "2026.11.07c"

esphome:
  name: waveshare-display-test
  friendly_name: "Heizungs Display Übersicht Touch"
  includes:
    - heizungs-display/helpers.h
  on_boot:
    priority: -100
    then:
      - audio_dac.set_volume:
          id: codec
          volume: 85%
      # LVGL fragt den Touch sonst nur alle ~33 ms ab: kurze Tipper (z.B. Blaettern unten)
      # liegen dann zwischen zwei Abfragen und gehen verloren. 10 ms = schneller als der Touch (20 ms)
      - lambda: |-
          for (lv_indev_t *i = lv_indev_get_next(nullptr); i != nullptr; i = lv_indev_get_next(i)) {
            lv_timer_t *t = lv_indev_get_read_timer(i);
            if (t != nullptr) lv_timer_set_period(t, 10);
          }

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN   # weniger Log-Ausgaben = fluessigere Anzeige

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare-Test-Fallback"
    password: !secret heizung_display__ap_password

captive_portal:

i2c:
  - id: i2c_bus
    sda: GPIO8
    scl: GPIO7
    frequency: 400kHz   # Touch, Erweiterungs-Chip (Display-CS) und Ton teilen sich diesen Bus
    scan: true

pca9554:
  - id: p_c_a
    address: 0x20
    i2c_id: i2c_bus

output:
  - platform: ledc
    pin: GPIO6
    id: backlight_pwm
    frequency: 2000 Hz

light:
  - platform: monochromatic
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0

spi:
  id: display_spi
  clk_pin: GPIO5
  mosi_pin: GPIO1
  miso_pin: GPIO2

display:
  - platform: mipi_spi
    id: my_display
    model: st7796
    spi_id: display_spi
    cs_pin:
      pca9554: p_c_a
      number: 2
    dc_pin: GPIO3
    reset_pin:
      pca9554: p_c_a
      number: 1
    spi_mode: 1
    data_rate: 40MHz
    color_order: bgr
    invert_colors: true
    pixel_mode: 16bit
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: ft63x6
    id: my_touch
    update_interval: 20ms   # kein Interrupt: Touch wird abgefragt, kurze Tipper nicht verpassen
    i2c_id: i2c_bus

    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

    on_touch:
      # Beleuchtung aus: sofort einschalten. Bewusst nicht von lvgl.is_paused abhaengig,
      # das Intervall unten startet LVGL wieder, sobald das Licht an ist.
      - if:
          condition:
            light.is_off: display_backlight
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 100%
      # Klick-Ton als Feedback
      - speaker.play:
