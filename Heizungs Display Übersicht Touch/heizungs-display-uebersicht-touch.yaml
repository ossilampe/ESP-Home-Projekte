      # Display schlaeft: Beleuchtung sofort wieder an
      - if:
          condition: lvgl.is_paused
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 100%

    on_release:
      # Erst beim Loslassen LVGL wieder starten, damit die Weck-Beruehrung
      # nicht gleichzeitig die Seite wechselt
