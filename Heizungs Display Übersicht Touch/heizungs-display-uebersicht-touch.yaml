          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - lambda: |-
                lv_disp_trig_activity(NULL);

# ---------- Ton (ES8311 + Lautsprecher) ----------
audio_dac:
  - platform: es8311
    id: codec
    i2c_id: i2c_bus
    address: 0x18

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO13
    i2s_mclk_pin: GPIO12

speaker:
  - platform: i2s_audio
    id: lautsprecher
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO16
    audio_dac: codec
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    timeout: never

# Verstaerker (PA) ueber den Erweiterungs-Chip
switch:
  - platform: gpio
    id: verstaerker
    pin:
      pca9554: p_c_a
      number: 7
    restore_mode: ALWAYS_ON

  # SSR fuer die Pumpe Kamin: GPIO38 (Leisten-Pin 7) ueber BC547, nach jedem Start aus
  - platform: gpio
    id: ssr_kamin
    name: "Pumpe Kamin SSR"
    pin: GPIO38
    restore_mode: ALWAYS_OFF

  # Handbetrieb Pumpe Kamin: Regelung ruht, Pumpe Gas schaltet trotzdem ab; endet nach 2 h
  - platform: template
    id: kamin_hand
    name: "Pumpe Kamin Handbetrieb"
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: 'id(hand_seit) = millis();'


# ===================================================================
#  Heizungs Display Uebersicht Touch - Design wie das Display Buderus
#  schwarzer Hintergrund, Kopfzeile WLAN + Uhrzeit, jede Seite eine Farbe
#  Menue:  1 Uebersicht  2 Puffer  3 Temperaturen  4 Gas  5 Gaskosten  6 Solar
#  Unterseiten (nur per Antippen): Warmwasser, Einstellungen, Akkus
# ===================================================================

# Die 10 Pylontech-Module (gleicher Aufbau, nur die Nummer wechselt)
packages:
  akku1: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 1}}
  akku2: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 2}}
  akku3: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 3}}
  akku4: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 4}}
  akku5: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 5}}
  akku6: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 6}}
  akku7: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 7}}
  akku8: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 8}}
  akku9: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 9}}
  akku10: !include {file: heizungs-display/akku-modul.yaml, vars: {n: 10}}

# welche Schaltung gerade nachgefragt wird: 1 Gas zuheizen, 2 Heizstab, 3 Zirkulation, 4 Speichern, 5 Pumpe Kamin
globals:
  # Regelung Pumpe Kamin: Schaltwerte aus HA, hier gespeichert (gelten auch ohne HA und nach Neustart)
  - id: r_to
    type: float
    restore_value: true
    initial_value: "42.0"
  - id: r_tu
    type: float
    restore_value: true
    initial_value: "33.0"
  - id: r_tm
    type: float
    restore_value: true
    initial_value: "26.0"
  # Ausschalten: unter Grenze minus Hysterese (gilt fuer oben, mitte und unten)
  - id: r_hy
    type: float
    restore_value: true
    initial_value: "5.0"
  # Ueberhitzungsschutz: ab Puffer oben >= r_max laeuft die Pumpe Kamin immer (aus erst 5 K darunter)
  - id: r_max
    type: float
    restore_value: true
    initial_value: "85.0"
  - id: ueberhitzt
    type: bool
    initial_value: "false"
  - id: r_nl
    type: float
    restore_value: true
    initial_value: "10.0"
  # Zeitpunkt (millis), seit dem eine Temperatur unter der Ausschaltgrenze liegt (0 = nicht)
  - id: unter_seit
    type: uint32_t
    initial_value: "0"
  # Beginn des Handbetriebs (millis), endet nach 2 Stunden von selbst
  - id: hand_seit
    type: uint32_t
    initial_value: "0"
  - id: frage_aktion
    type: int
    initial_value: "0"
  # Einstellungen: am Display eingestellte, noch nicht gespeicherte Grenzwerte
  - id: to_neu
    type: float
    initial_value: "NAN"
  - id: tu_neu
    type: float
    initial_value: "NAN"
  - id: tm_neu
    type: float
    initial_value: "NAN"
  - id: hy_neu
    type: float
    initial_value: "NAN"
  - id: max_neu
    type: float
    initial_value: "NAN"
  - id: nl_neu
    type: float
    initial_value: "NAN"
  - id: einst_geaendert
    type: bool
    initial_value: "false"
  # welche Admin-Seite gerade offen ist (0 = keine), nur dann werden ihre Werte nachgefuehrt
  - id: adm_seite
    type: int
    initial_value: "0"
  # Profile Tag/Abend am Display: Werte in Bearbeitung (0-3 Tag oben/mitte/unten/K, 4-7 Abend), Uhrzeiten in Minuten
  - id: pn
    type: std::array<float, 8>
  - id: z_tag
    type: int
    initial_value: "-1"
  - id: z_abend
    type: int
    initial_value: "-1"
  - id: prof_geaendert
    type: bool
    initial_value: "false"

# 1-Wire-Bus fuer die DS18B20-Fuehler: Daten = GPIO48 (Leisten-Pin 23), 4,7 kOhm nach 3,3 V
one_wire:
  - platform: gpio
    pin: GPIO48
    id: ow_bus

time:
  - platform: homeassistant
    id: esptime

script:
  # Pumpe Kamin von Hand: Handbetrieb an, dann SSR umschalten
  - id: pumpe_hand_schalten
    then:
      - switch.turn_on: kamin_hand
      - switch.toggle: ssr_kamin

  # Pumpe Kamin anzeigen: Zustand plus Hand oder Automatik
  - id: kamin_zeigen
    then:
      - lambda: |-
          int z = id(rm_kamin).state ? 1 : 0;
          bool hand = id(kamin_hand).state;
          if (hand) hz::ein_aus(pu_ventil, z, "Hand: EIN", "Hand: AUS");
          else hz::ein_aus(pu_ventil, z, "Heizen per Kamin", "aus");
          hz::knopf(kn_pumpe, kn_pumpe_z, z);
          lv_obj_set_style_bg_color(pu_ventil_dot, lv_color_hex(z == 1 ? hz::GRUEN : (z == 0 ? hz::ROT : hz::GRAU)), 0);
          lv_label_set_text(kn_auto_t, hand ? "Hand" : "Auto");
          lv_obj_set_style_text_color(kn_auto_t, lv_color_hex(hand ? hz::ORANGE : hz::GRUEN), 0);
          lv_obj_set_style_border_color(kn_auto, lv_color_hex(hand ? hz::ORANGE : hz::GRUEN), 0);

  # Pumpe Gas anzeigen (Rueckmeldung Decoupler 2): an = Heizen per Gas
  - id: gas_zeigen
    then:
      - lambda: |-
          int z = id(rm_gas).state ? 1 : 0;
          hz::ein_aus(pu_pumpe, z, "Heizen per Gas", "Gas unterdrückt");
          if (z == 1) hz::txt(ov_gas, "Heizen per Gas", hz::GRUEN);
          else hz::txt(ov_gas, "Gas Heizung aus", hz::ROT);
          lv_obj_set_style_bg_color(pu_pumpe_dot, lv_color_hex(z == 1 ? hz::GRUEN : hz::ROT), 0);

  # Seitenzahl im Home-Knopf; n = 0 = Unterseite (Warmwasser, Einstellungen):
  # dort sind Blaettern und Home ausgeblendet, es gibt nur "Zurueck"
  # Seitentitel in der Kopfzeile (zwischen WLAN und Uhrzeit) in der Seitenfarbe
  - id: set_seite
    parameters:
      n: int
      titel: string
      farbe: int
    then:
      - lambda: |-
          lv_label_set_text(hdr_titel, titel.c_str());
          lv_obj_set_style_text_color(hdr_titel, lv_color_hex(farbe), 0);
          lv_obj_t *nav[3] = {nav_zurueck, nav_home, nav_weiter};
          for (auto *o : nav) {
            if (n == 0) lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
          }
          if (n > 0) {
            char b[12];
            snprintf(b, sizeof(b), "%d / 6", n);
            lv_label_set_text(nav_seite, b);
          }

  # Admin-Seiten: Werte der gerade offenen Seite nachfuehren
  - id: admin_update
    then:
      - lambda: |-
          int s = id(adm_seite);
          char b[64];
          if (s == 1) {
            float db = id(wifi_db).state;
            if (std::isnan(db)) snprintf(b, sizeof(b), "--");
            else snprintf(b, sizeof(b), "%.0f dBm (%d %%)", db, std::max(0, std::min(100, (int) (2 * (db + 100)))));
            lv_label_set_text(a_wlan, b);
            lv_label_set_text(a_ssid, id(wifi_ssid_t).state.empty() ? "--" : id(wifi_ssid_t).state.c_str());
            lv_label_set_text(a_ip, id(wifi_ip).state.empty() ? "--" : id(wifi_ip).state.c_str());
            lv_label_set_text(a_mac, id(wifi_mac).state.empty() ? "--" : id(wifi_mac).state.c_str());
            float up = id(laufzeit).state;
            if (std::isnan(up)) snprintf(b, sizeof(b), "--");
            else {
              uint32_t t = (uint32_t) up;
              snprintf(b, sizeof(b), "%u Tage %02u:%02u h", (unsigned) (t / 86400), (unsigned) ((t % 86400) / 3600), (unsigned) ((t % 3600) / 60));
            }
            lv_label_set_text(a_lauf, b);
            bool ha = api::global_api_server != nullptr && api::global_api_server->is_connected();
            hz::txt(a_ha, ha ? "verbunden" : "getrennt", ha ? hz::GRUEN : hz::ROT);
          } else if (s == 2) {
            sensor::Sensor *ds[5] = {id(ds_3), id(ds_5), id(ds_2), id(ds_4), id(ds_1)};
            lv_obj_t *lb[5] = {a_t1, a_t2, a_t3, a_t4, a_t5};
            for (int i = 0; i < 5; i++) {
              float v = ds[i]->state;
              if (std::isnan(v)) hz::txt(lb[i], "Fehler", hz::ROT);
              else { snprintf(b, sizeof(b), "%.1f °C", v); hz::txt(lb[i], b, hz::GRUEN); }
            }
            // P6 = Ruecklaufanhebung am Ofen, P1 = Pumpe Gas, P2 = Alpha Puffer -> Haus ("Pumpe Kamin")
            const char *nm[6] = {"P6 Ofen", "P1 Gas", "P2 Puffer", "Ventil V1", "SSR P2", "Hand P2"};
            bool st[6] = {id(rm_p6).state, id(rm_gas).state, id(rm_kamin).state, id(rm_ventil).state, id(ssr_kamin).state, id(kamin_hand).state};
            lv_obj_t *bl[6] = {a_b1, a_b2, a_b3, a_b4, a_b5, a_b6};
            for (int i = 0; i < 6; i++) {
              snprintf(b, sizeof(b), "%s: %s", nm[i], st[i] ? "an" : "aus");
              hz::txt(bl[i], b, st[i] ? hz::GRUEN : hz::GRAU);
            }
          } else if (s == 3) {
            snprintf(b, sizeof(b), "%u kB", (unsigned) (heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024));
            lv_label_set_text(a_ram, b);
            snprintf(b, sizeof(b), "%u kB", (unsigned) (heap_caps_get_free_size(MALLOC_CAP_SPIRAM) / 1024));
            lv_label_set_text(a_psram, b);
          }

  # BWWP: eingeschaltet (switch.warmepumpe) und laeuft wirklich (60 - 900 W)
  - id: bwwp_update
    then:
      - lambda: |-
          int an = hz::zustand(id(ts_wp).state);
          float p = id(wp_leistung).state;
          bool laeuft = !std::isnan(p) && p > 60.0f && p < 900.0f;
          hz::ein_aus(ww_bwwp, an);
          if (an == 1 && laeuft) {
            hz::txt(ov_bwwp, "BWWP läuft", hz::GRUEN);
            hz::txt(ww_betrieb, "läuft", hz::GRUEN);
          } else if (an == 1) {
            hz::txt(ov_bwwp, "BWWP steht", hz::ROT);
            hz::txt(ww_betrieb, "steht", hz::ROT);
          } else if (an == 0) {
            hz::txt(ov_bwwp, "BWWP aus", hz::GRAU);
            hz::txt(ww_betrieb, "aus", hz::GRAU);
          } else {
            hz::txt(ov_bwwp, "BWWP --", hz::GRAU);
            hz::txt(ww_betrieb, "--", hz::GRAU);
          }

  # Gas-Seiten: Verbrauch, Kosten (Verbrauch x Gaspreis) und Gesamtkosten aus HA
  - id: gas_update
    then:
      - lambda: |-
          float preis = id(g_preis).state;
          hz::num(gv_heute, id(g_heute).state, "%.1f kWh");
          hz::num(gv_gestern, id(g_gestern).state, "%.1f kWh");
          hz::num(gv_vorgestern, id(g_vorgestern).state, "%.1f kWh");
          hz::num(gv_woche, id(g_woche).state, "%.0f kWh");
          hz::num(gv_monat, id(g_monat).state, "%.0f kWh");
          hz::num(gv_jahr, id(g_jahr).state, "%.0f kWh");
          hz::num(gv_zs, id(g_zs).state, "%.1f m³");
          hz::num(gv_preis, preis, "%.3f €/kWh");
          hz::num(gk_heute, id(g_heute).state * preis, "%.2f €");
          hz::num(gk_gestern, id(g_gestern).state * preis, "%.2f €");
          hz::num(gk_vorgestern, id(g_vorgestern).state * preis, "%.2f €");
          hz::num(gk_woche, id(k_woche).state, "%.2f €");
          hz::num(gk_monat, id(k_monat).state, "%.2f €");
          hz::num(gk_jahr, id(k_jahr).state, "%.2f €");
          hz::num(gk_grund, id(g_grund).state, "%.2f €/Monat");

  # Puffer: Tank-Farbverlauf nach echter Temperatur oben / unten
  - id: puffer_update
    then:
      - lambda: |-
          float o = id(ds_3).state;
          float u = id(ds_2).state;
          char b[32];
          if (std::isnan(o) && std::isnan(u)) snprintf(b, sizeof(b), "--");
          else if (std::isnan(u)) snprintf(b, sizeof(b), "%.0f° / --", o);
          else if (std::isnan(o)) snprintf(b, sizeof(b), "-- / %.0f°", u);
          else snprintf(b, sizeof(b), "%.0f° / %.0f°", o, u);
          lv_label_set_text(ov_puffer, b);
          if (std::isnan(o)) o = u;
          if (std::isnan(u)) u = o;
          if (std::isnan(o)) {
            lv_obj_set_style_bg_color(pu_tank, lv_color_hex(0x1F1F1F), 0);
            lv_obj_set_style_bg_grad_color(pu_tank, lv_color_hex(0x1F1F1F), 0);
          } else {
            lv_obj_set_style_bg_color(pu_tank, hz::temp_farbe(o), 0);
            lv_obj_set_style_bg_grad_color(pu_tank, hz::temp_farbe(u), 0);
          }
          hz::num(pu_oben, id(ds_3).state, "%.1f°");
          hz::num(pu_unten, id(ds_2).state, "%.1f°");
          lv_obj_set_style_text_color(pu_oben, hz::temp_farbe(id(ds_3).state), 0);
          lv_obj_set_style_text_color(pu_unten, hz::temp_farbe(id(ds_2).state), 0);
          hz::num(pu_mitte, id(ds_5).state, "%.1f°");
          lv_obj_set_style_text_color(pu_mitte, hz::temp_farbe(id(ds_5).state), 0);

  # Einstellungen anzeigen: orange = geaendert, aber noch nicht gespeichert
  - id: einst_zeigen
    then:
      - lambda: |-
          float neu[6] = {id(to_neu), id(tm_neu), id(tu_neu), id(hy_neu), id(nl_neu), id(max_neu)};
          float ha[6] = {id(grenze_to).state, id(grenze_tm).state, id(grenze_tu).state, id(grenze_hy).state,
                         id(grenze_nl).state, id(grenze_max).state};
          lv_obj_t *lb[6] = {e_to, e_tm, e_tu, e_hy, e_nl, e_max};
          const char *fmt[6] = {"%.1f°", "%.1f°", "%.1f°", "%.0f K", "%.0f", "%.0f°"};
          bool irgendwas = false;
          for (int i = 0; i < 6; i++) {
            bool anders = std::isnan(ha[i]) || std::fabs(neu[i] - ha[i]) > 0.05f;
            irgendwas |= anders;
            hz::num(lb[i], neu[i], fmt[i]);
            lv_obj_set_style_text_color(lb[i], lv_color_hex(anders ? hz::ORANGE : hz::WEISS), 0);
          }
          lv_label_set_text(e_hinweis, irgendwas ? "noch nicht gespeichert" : "");

  # Schaltwerte auf Puffer-, Uebersichts- und Einstellungsseite
  - id: grenzen_update
    then:
      - lambda: |-
          // Einstellungsseite nur nachfuehren, solange dort nichts ungespeichert geaendert ist
          if (!id(einst_geaendert)) {
            id(to_neu) = id(grenze_to).state;
            id(tu_neu) = id(grenze_tu).state;
            id(tm_neu) = id(grenze_tm).state;
            id(hy_neu) = id(grenze_hy).state;
            id(nl_neu) = id(grenze_nl).state;
            id(max_neu) = id(grenze_max).state;
            id(einst_zeigen).execute();
          }
          // aktives Profil (Tag / Abend) aus HA
          std::string p = id(ts_profil).state;
          bool p_ok = (p == "Tag" || p == "Abend");
          if (p_ok && id(bs_ganztags).state) hz::txt(e_profil, "Ganztags", hz::GELB);
          else hz::txt(e_profil, p_ok ? p.c_str() : "--", p_ok ? (p == "Abend" ? hz::ORANGE : hz::GELB) : hz::GRAU);
          char b[48];
          float o = id(grenze_to).state, u = id(grenze_tu).state, m = id(grenze_tm).state;
          if (std::isnan(o) || std::isnan(u) || std::isnan(m)) snprintf(b, sizeof(b), "--");
          else snprintf(b, sizeof(b), "%.0f / %.0f / %.0f °C", o, m, u);
          lv_label_set_text(pu_grenzen, b);
          float ko = id(grenze_hy).state, nl = id(grenze_nl).state;
          if (std::isnan(ko) || std::isnan(nl)) snprintf(b, sizeof(b), "--");
          else snprintf(b, sizeof(b), "%.0f K  %.0f min  %s", ko, nl, p_ok ? p.c_str() : "");
          lv_label_set_text(pu_hysterese, b);
          if (std::isnan(o) || std::isnan(u) || std::isnan(m)) lv_label_set_text(ov_grenzen, "");
          else {
            snprintf(b, sizeof(b), "Schalten %.0f / %.0f / %.0f °C", o, m, u);
            lv_label_set_text(ov_grenzen, b);
          }

  # Seite Profile: Werte aus HA uebernehmen, solange am Display nichts ungespeichert geaendert ist
  - id: profil_laden
    then:
      - lambda: |-
          if (id(prof_geaendert)) return;
          sensor::Sensor *hp[8] = {id(hp_0), id(hp_1), id(hp_2), id(hp_3), id(hp_4), id(hp_5), id(hp_6), id(hp_7)};
          for (int i = 0; i < 8; i++) id(pn)[i] = hp[i]->state;
          id(z_tag) = hz::minuten(id(ts_tag_ab).state);
          id(z_abend) = hz::minuten(id(ts_abend_ab).state);
      - script.execute: profil_zeigen

  # Seite Profile anzeigen: orange = geaendert, Abend und Uhrzeiten grau bei Ganztags
  - id: profil_zeigen
    then:
      - lambda: |-
          sensor::Sensor *hp[8] = {id(hp_0), id(hp_1), id(hp_2), id(hp_3), id(hp_4), id(hp_5), id(hp_6), id(hp_7)};
          lv_obj_t *lb[8] = {pv_0, pv_1, pv_2, pv_3, pv_4, pv_5, pv_6, pv_7};
          bool irgendwas = false;
          for (int i = 0; i < 8; i++) {
            bool anders = std::isnan(hp[i]->state) || std::fabs(id(pn)[i] - hp[i]->state) > 0.05f;
            irgendwas |= anders;
            hz::num(lb[i], id(pn)[i], (i % 4 == 3) ? "%.0f K" : "%.1f°");
            lv_obj_set_style_text_color(lb[i], lv_color_hex(anders ? hz::ORANGE : hz::WEISS), 0);
          }
          int zt = id(z_tag), za = id(z_abend);
          bool zt_anders = zt != hz::minuten(id(ts_tag_ab).state), za_anders = za != hz::minuten(id(ts_abend_ab).state);
          irgendwas |= zt_anders || za_anders;
          char b[8];
          if (zt < 0) snprintf(b, sizeof(b), "--"); else snprintf(b, sizeof(b), "%02d:%02d", zt / 60, zt % 60);
          hz::txt(pv_zt, b, zt_anders ? hz::ORANGE : hz::WEISS);
          if (za < 0) snprintf(b, sizeof(b), "--"); else snprintf(b, sizeof(b), "%02d:%02d", za / 60, za % 60);
          hz::txt(pv_za, b, za_anders ? hz::ORANGE : hz::WEISS);
          lv_obj_set_style_border_color(kn_prof_speichern, lv_color_hex(irgendwas ? hz::ORANGE : 0xA673FF), 0);
          bool gt = id(bs_ganztags).state;
          hz::txt(kn_modus_t, gt ? "Ganztags" : "Uhrzeit", gt ? hz::GELB : hz::GRUEN);
          for (lv_obj_t *box : {pr_abend, pr_tagzeit}) {
            lv_obj_set_style_opa(box, gt ? LV_OPA_30 : LV_OPA_COVER, 0);
            uint32_t n = lv_obj_get_child_cnt(box);
            for (uint32_t k = 0; k < n; k++) {
              lv_obj_t *ch = lv_obj_get_child(box, k);
              if (gt) lv_obj_add_state(ch, LV_STATE_DISABLED); else lv_obj_clear_state(ch, LV_STATE_DISABLED);
            }
          }

  # Solar: Summe der drei Phasen
  - id: solar_update
    then:
      - lambda: |-
          float s = 0; bool ok = false;
          for (float v : {id(sens_wr1_p).state, id(sens_wr2_p).state, id(sens_wr3_p).state}) {
            if (!std::isnan(v)) { s += v; ok = true; }
          }
          hz::num(so_summe, ok ? s : NAN, "%.0f W");

# Uhrzeit in der Kopfzeile
interval:
  # Admin-Seiten nachfuehren (tut nichts, solange keine Admin-Seite offen ist)
  - interval: 2s
    then:
      - script.execute: admin_update
  # Regelung Pumpe Kamin (frueher Script auf dem Shelly): ein ab TO, TM und TU,
  # aus wenn einer davon unter seiner Grenze minus seiner eigenen Hysterese (K oben/mitte/unten) liegt,
  # nach der Nachlaufzeit. Vorrang: 1. Ueberhitzungsschutz, 2. Pumpe Gas, 3. Handbetrieb
  - interval: 10s
    then:
      - lambda: |-
          float t1 = id(ds_3).state, t2 = id(ds_2).state, tm = id(ds_5).state;
          bool an = id(ssr_kamin).state;
          // Ueberhitzungsschutz: Puffer oben >= Max -> Pumpe laeuft immer, bis 5 K darunter
          if (!std::isnan(t1) && t1 >= id(r_max)) {
            if (!id(ueberhitzt)) ESP_LOGW("kamin", "Ueberhitzungsschutz: Puffer oben %.1f >= %.0f -> Pumpe Kamin an", t1, id(r_max));
            id(ueberhitzt) = true;
          } else if (id(ueberhitzt) && (std::isnan(t1) || t1 < id(r_max) - 5.0f)) {
            ESP_LOGW("kamin", "Ueberhitzungsschutz beendet");
            id(ueberhitzt) = false;
          }
          if (id(ueberhitzt)) {
            id(unter_seit) = 0;
            if (!an) id(ssr_kamin).turn_on();
            return;
          }
          if (id(rm_gas).state) {
            id(unter_seit) = 0;
            if (an) { ESP_LOGI("kamin", "Pumpe Gas laeuft -> Pumpe Kamin aus"); id(ssr_kamin).turn_off(); }
            return;
          }
          if (id(kamin_hand).state) {
            id(unter_seit) = 0;
            if (millis() - id(hand_seit) >= 7200000UL) { ESP_LOGI("kamin", "Handbetrieb nach 2 h beendet"); id(kamin_hand).turn_off(); }
            return;
          }
          if (!an) {
            id(unter_seit) = 0;
            if (!std::isnan(t1) && !std::isnan(t2) && !std::isnan(tm) && t1 >= id(r_to) && tm >= id(r_tm) && t2 >= id(r_tu)) {
              ESP_LOGI("kamin", "TO/TM/TU erreicht -> Pumpe Kamin an");
              id(ssr_kamin).turn_on();
            }
            return;
          }
          bool unter = std::isnan(t1) || std::isnan(t2) || std::isnan(tm) || t1 < id(r_to) - id(r_hy) || tm < id(r_tm) - id(r_hy) || t2 < id(r_tu) - id(r_hy);
          if (!unter) { id(unter_seit) = 0; return; }
          if (id(unter_seit) == 0) id(unter_seit) = millis() | 1;
          if (millis() - id(unter_seit) >= (uint32_t) (id(r_nl) * 60000.0f)) {
            ESP_LOGI("kamin", "Nachlauf abgelaufen -> Pumpe Kamin aus");
            id(unter_seit) = 0;
            id(ssr_kamin).turn_off();
          }
  # Testseite Rueckmeldungen: Punkte nachfuehren (nur bei Aenderung neu zeichnen)
  - interval: 500ms
    then:
      - lambda: |-
          static int alt[4] = {-1, -1, -1, -1};
          lv_obj_t *dot[4] = {rm_dot1, rm_dot2, rm_dot3, rm_dot4};
          lv_obj_t *txt[4] = {rm_txt1, rm_txt2, rm_txt3, rm_txt4};
          bool st[4] = {id(rm_p6).state, id(rm_gas).state, id(rm_kamin).state, id(rm_ventil).state};
          static int ssr_alt = -1;
          int ssr = id(ssr_kamin).state ? 1 : 0;
          if (ssr != ssr_alt) { ssr_alt = ssr; hz::knopf(kn_ssr, kn_ssr_z, ssr); }
          static int k_alt = -1, g_alt = -1;
          static int h_alt = -1;
          int h = id(kamin_hand).state ? 1 : 0;
          if (h != h_alt) { h_alt = h; id(kamin_zeigen).execute(); }
          int k = id(rm_kamin).state ? 1 : 0, g = id(rm_gas).state ? 1 : 0;
          if (k != k_alt) { k_alt = k; id(kamin_zeigen).execute(); }
          if (g != g_alt) { g_alt = g; id(gas_zeigen).execute(); }
          for (int i = 0; i < 4; i++) {
            int s = st[i] ? 1 : 0;
            if (s == alt[i]) continue;
            alt[i] = s;
            lv_obj_set_style_bg_color(dot[i], lv_color_hex(s ? hz::GRUEN : hz::GRAU), 0);
            hz::txt(txt[i], s ? "Spannung da" : "keine Spannung", s ? hz::GRUEN : hz::GRAU);
          }
  # Sicherheitsnetz: Beleuchtung an, aber LVGL haengt noch in der Pause -> wieder starten
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lvgl.is_paused:
              - light.is_on: display_backlight
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - lambda: 'lv_disp_trig_activity(NULL);'
  - interval: 10s
    then:
      - lambda: |-
          auto t = id(esptime).now();
          if (t.is_valid()) {
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            lv_label_set_text(hdr_zeit, b);
          }

