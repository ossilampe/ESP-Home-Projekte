# BWWP-Steuerung
# Brauchwasser-Wärmepumpe: Ein Servo drückt auf Knopfdruck aus Home Assistant die Taste
# am Gerät (Heizstab), ein BH1750 liest die Status-LED der Wärmepumpe aus.
# Details und Verdrahtung: README.md

esphome:
  name: bwwp-steuerung
  friendly_name: BWWP-Steuerung

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret bwwp_steuerung__encryption_key
ota:
  platform: esphome
  password: !secret bwwp_steuerung__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Feste IP – an das eigene Netz anpassen oder den Block entfernen (DHCP)
  manual_ip:
    static_ip: 192.168.50.100
    gateway: 192.168.50.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bwwp-Steuerung Fallback Hotspot"
    password: !secret bwwp_steuerung__ap_password

captive_portal:

 


#Staus LED
status_led:
  pin: D2

# Lichtsensor
i2c:  
  - id: lux_bus  
    sda: D3 
    scl: D4 
    scan: True  

sensor:    
  - platform: bh1750  
    i2c_id: lux_bus  
    name: "BH1750 Illuminance"  
    address: 0x23  
    update_interval: 10s

#Schaltet LED für Lichtsensor

#Servo Pin
output:
  - platform: esp8266_pwm
    id: pwm_output
    pin: D7
    frequency: 50 Hz

button:
  - platform: template
    name: Turn On
    id: my_btn_on
    icon: "mdi:light-switch"
    on_press:
      - number.set:
          id: servo_value
          value: !lambda "return id(press_distance).state;"
      - delay: !lambda "return id(press_duration).state;"
      - number.set:
          id: servo_value
          value: 0




#LED Pin BWWP Heizstab aktiv
switch:
- platform: gpio
  pin: D1
  id: led_lichtsensor
  inverted: false
- platform: gpio
  pin: D8
  id: led_system
  inverted: false
#RESTART ESP
- platform: restart
  name: "BWWP-Steuerung-Restart"



 



#LED Steuerung_LichtsensorLED
- platform: template
  name: "Esp-Lichtsensor-Wp-Status-LED"
  icon: "mdi:led-on"
  optimistic: yes
  id: led1
  turn_on_action:
  - switch.turn_on: led_lichtsensor
  turn_off_action:
  - switch.turn_off: led_lichtsensor

#LED Steuerung_LichtsensorLED
- platform: template
  name: "Esp-Lichtsensor-Wp-Status-Servo-LED"
  icon: "mdi:led-on"
  optimistic: yes
  id: led2
  turn_on_action:
  - while:
      condition:
        lambda: 'return true;'
      then:
      - switch.turn_on: led_system
      - delay: 50ms 
      - switch.turn_off: led_system
      - delay: 3000ms
  turn_off_action:
  - switch.turn_off: led_system


#Servo steuerung
servo:
  - id: my_servo
    output: pwm_output




number:
  - platform: template
    id: servo_value
    name: Servo Position
    min_value: -100
    initial_value: 0
    max_value: 100
    step: 1
    optimistic: true
    set_action:
      then:
      - servo.write:
          id: my_servo
          level: !lambda 'return x / 100.0;'


  - platform: template
    id: press_duration
    name: Press Duration
    min_value: 300
    initial_value: 500
    max_value: 5000
    step: 100
    mode: box
    optimistic: true

  - platform: template
    id: press_distance
    name: Press Distance
    min_value: 0
    initial_value: 60
    max_value: 200
    step: 1
    mode: box
    optimistic: true   



