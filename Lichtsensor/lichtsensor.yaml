# Lichtsensor
# Wemos D1 mini mit GY-302 (BH1750) meldet die Helligkeit in Lux an Home Assistant.
# Details und Verdrahtung: README.md

esphome:
  name: lichtsensor
  friendly_name: Lichtsensor

esp8266:
  board: d1_mini

# Enable logging
logger:

i2c:
  sda: D1  # Anpassen je nach Verkabelung (z. B. GPIO4)
  scl: D2  # Anpassen je nach Verkabelung (z. B. GPIO5)
  scan: true

sensor:
  - platform: bh1750
    name: "Helligkeit GY-302"
    address: 0x23 
    update_interval: 10s

# Enable Home Assistant API
api:
  encryption:
    key: !secret lichtsensor__encryption_key

ota:
  - platform: esphome
    password: !secret lichtsensor__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Feste IP – an das eigene Netz anpassen oder den Block entfernen (DHCP)
  manual_ip:
    static_ip: 192.168.50.95
    gateway: 192.168.50.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Lichtsensor Fallback Hotspot"
    password: !secret lichtsensor__ap_password

captive_portal:
    