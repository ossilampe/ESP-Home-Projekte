# Test Lilygo 2
# LILYGO T-Display S3 (ESP32-S3, 1,9″ Farbdisplay 320×170) zeigt im 3-s-Wechsel
# Außentemperatur und Luftfeuchte aus Home Assistant, dazu WLAN-Signal und Uhrzeit.
# Details: README.md

esphome:
  name: test-lilygo-2
  friendly_name: test lilygo 2
  on_boot:
    priority: 90 # Adjust priority as needed, higher priority runs earlier
    then:
      - output.turn_on: lcd_power_on
  platformio_options:
    board_build.f_flash: 80000000L
    board_build.partitions: default_16MB.csv
    board_build.arduino.memory_type: qio_opi

external_components:
  - source: github://landonr/lilygo-tdisplays3-esphome
    components: [tdisplays3]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino
  flash_size: 16MB
# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret test_lilygo_2__encryption_key

ota:
  - platform: esphome
    password: !secret test_lilygo_2__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Feste IP – an das eigene Netz anpassen oder den Block entfernen (DHCP)
  manual_ip:
    static_ip: 192.168.50.84
    gateway: 192.168.50.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Test-Lilygo-2 Fallback Hotspot"
    password: !secret test_lilygo_2__ap_password


captive_portal:




time:
  - platform: homeassistant
    id: esptime

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    name: "Button 1"
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
    name: "Button 2"

output:
  - platform: ledc
    pin: GPIO38
    id: gpio38
    frequency: 2000

  - platform: gpio
    pin: GPIO15
    id: lcd_power_on

light:
  - platform: monochromatic
    output: gpio38
    name: "Backlight"
    restore_mode: RESTORE_DEFAULT_ON

image:

  - file: "image/temperature.png"
    type: rgb565
    id: temperatur
    resize: 100x100
  - file: "image/feuchte.png"
    type: rgb565
    id: feuchte
    resize: 95x100
  - file: "image/temperature.png"
    type: rgb565
    id: temperatur1
    resize: 60x60
  - file: "image/feuchte.png"
    type: rgb565
    id: feuchte1
    resize: 60x60
  
 



font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 50

  - file: "gfonts://Roboto"
    id: roboto1
    size: 12

  - file: "gfonts://Roboto"
    id: roboto2
    size: 28

  - file: "gfonts://Audiowide"
    id: audiowide_font
    size: 40

color:
  #gelb
  - id: yellow
    red: 100%
    green: 100%
    blue: 0%
  #rot
  - id: red
    red: 100%
    green: 0%
    blue: 0%
  #grün
  - id: gren
    red: 0%
    green: 100%
    blue: 0%
  #cyan
  - id: cyan
    red: 0%
    green: 93%
    blue: 93%


    

sensor:
  - platform: homeassistant
    name: "mittelwert Temperatur"
    id: mittelwert_temperatur
    entity_id: sensor.mittelwert_temperatur_aussen
    internal: true

  - platform: homeassistant
    name: "mittelwert Feuchte"
    id: mittelwert_feuchte
    entity_id: sensor.mittelwert_huminity_aussen
    internal: true

  - platform: homeassistant
    name: "Waermepumpe"
    id: wp
    entity_id: sensor.shellyplus_temperatur_bwwp_puffer_temperature
    internal: true

  - platform: homeassistant
    name: "Solar-Akku"
    id: solarakku
    entity_id: sensor.victron_battery_soc
    internal: true

  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    



display:
  - platform: tdisplays3
    id: disp
    update_interval: 1s
    rotation: 270
    pages:
      - id: page1
        lambda: |-

          it.line(5, 30, 300, 30, id(cyan));
          it.printf(5, 0, id(roboto2), "%.0f %%",id(wifi_signal_db).state );
          it.strftime(100, 0, id(roboto2), "%H:%M", id(esptime).now());
          it.printf(15, 85, id(roboto), TextAlign::BASELINE_LEFT, "Aussen");
          it.printf(20, 90, id(roboto), "%.1f °C",id(mittelwert_temperatur).state );
          it.image(200, 35, id(temperatur));


      - id: page2
        lambda: |-


          it.line(5, 30, 300, 30, id(cyan));
          it.printf(5, 0, id(roboto2), "%.0f %%",id(wifi_signal_db).state );
          it.strftime(100, 0, id(roboto2), "%H:%M", id(esptime).now());
          it.printf(15, 85, id(roboto), TextAlign::BASELINE_LEFT, "Aussen");
          it.printf(20, 90, id(roboto), "%.1f %%",id(mittelwert_feuchte).state );
          it.image(200, 35, id(feuchte));

interval:
  - interval: 3s
    then:
      - display.page.show_next: disp
      - component.update: disp
