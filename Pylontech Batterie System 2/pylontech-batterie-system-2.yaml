  - platform: template
    id: pylontech_power
    name: "Pylontech power"
    unit_of_measurement: W
    lambda: |-
      // Akkus ohne Wert (NaN) werden übersprungen, sonst wäre die ganze Summe NaN
      sensor::Sensor *volt[] = {id(bat1_voltage), id(bat2_voltage), id(bat3_voltage),
                                id(bat4_voltage), id(bat5_voltage), id(bat6_voltage),
                                id(bat7_voltage), id(bat8_voltage), id(bat9_voltage),
                                id(bat10_voltage)};
      sensor::Sensor *curr[] = {id(bat1_current), id(bat2_current), id(bat3_current),
                                id(bat4_current), id(bat5_current), id(bat6_current),
                                id(bat7_current), id(bat8_current), id(bat9_current),
                                id(bat10_current)};
      float pwr = 0.0f;
      int count = 0;
      for (int i = 0; i < 10; i++) {
        if (!isnan(volt[i]->state) && !isnan(curr[i]->state)) {
          pwr += volt[i]->state * curr[i]->state;
          count++;
        }
      }
      if (count == 0) {
        return NAN;  // noch keine Daten von den Akkus
      }
      id(combined_charge_power).publish_state(pwr > 0.0f ? pwr : 0.0f);
      id(combined_discharge_power).publish_state(pwr < 0.0f ? -pwr : 0.0f);
      return pwr;
    update_interval: 5s
    device_class: power
    state_class: measurement

  - platform: template
    id: combined_charge_power

  - platform: template
    id: combined_discharge_power

  - platform: integration
    name: "Pylontech charging"
    sensor: combined_charge_power
    time_unit: h
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: "Wh"

  - platform: integration
    name: "Pylontech discharging"
    sensor: combined_discharge_power
    time_unit: h
    state_class: total_increasing
    device_class: energy
    unit_of_measurement: "Wh"

