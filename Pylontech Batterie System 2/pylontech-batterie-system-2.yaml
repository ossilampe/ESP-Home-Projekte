# Pylontech Batterie System 2
# Liest bis zu 10 Pylontech-Module (US5000 / US2000) über die Konsole des
# Master-Akkus aus: Spannung, Strom, SOC, Temperatur und Zellspannung min/max.
# Hardware: Wemos D1 mini + MAX3232-Modul (RS232 <-> TTL), Kabel an "Console".
# Details und Verdrahtung: README.md

esphome:
  name: pylontech-batterie-system-2
  friendly_name: Pylontech Batterie System 2

esp8266:
  board: d1_mini



# Hardware-UART des D1 mini (GPIO1 = TX, GPIO3 = RX) -> MAX3232 -> Pylontech Console.
# Das Log läuft deshalb über UART1 (siehe logger) bzw. per WLAN.
uart:
  - id: uart_pylontech
    tx_pin: 1 # tx pin for pylontech uart
    rx_pin: 3 # rx pin for pylontech uart
    baud_rate: 115200 # baudrate for pylontech uart
    rx_buffer_size: 2048
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        delimiter: "\n"
      sequence:
        - lambda: UARTDebug::log_string(direction, bytes);


# Enable logging
logger:
  hardware_uart: UART1

pylontech:
  - id: pylontech0
    uart_id: uart_pylontech
    update_interval: 20s



# Enable Home Assistant API
api:
  encryption:
    key: !secret pylontech_batterie_system_2__encryption_key

ota:
  - platform: esphome
    password: !secret pylontech_batterie_system_2__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Feste IP – an das eigene Netz anpassen oder den Block entfernen (DHCP)
  manual_ip:
    static_ip: 192.168.50.97
    gateway: 192.168.50.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Pylontech-Batterie-System-2"
    password: !secret pylontech_batterie_system_2__ap_password

captive_portal:
    
