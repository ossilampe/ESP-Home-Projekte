  <text x="47" y="36" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600">TO 36.0</text>
  <text x="125" y="36" font-size="18" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600">TU 30.5</text>
  <g fill="#2A3541" stroke="#8FA3B5" stroke-width="2">
    <rect x="10" y="60" width="34" height="32" rx="8"/><rect x="48" y="60" width="34" height="32" rx="8"/><rect x="88" y="60" width="34" height="32" rx="8"/><rect x="126" y="60" width="34" height="32" rx="8"/>
  </g>
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <line x1="21" y1="76" x2="33" y2="76"/><line x1="59" y1="76" x2="71" y2="76"/><line x1="65" y1="70" x2="65" y2="82"/>
    <line x1="99" y1="76" x2="111" y2="76"/><line x1="137" y1="76" x2="149" y2="76"/><line x1="143" y1="70" x2="143" y2="82"/>
  </g>
  <!-- Seitenpunkte -->
  <g><rect x="204" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="220" y="306" width="8" height="8" rx="4" fill="#FF8A3D"/><rect x="236" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="252" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="268" y="306" width="8" height="8" rx="4" fill="#3A4652"/></g>
