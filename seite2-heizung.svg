<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="Montserrat, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="puffer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C2185B"/><stop offset="1" stop-color="#26A6B8"/></linearGradient>
  </defs>
  <rect width="480" height="320" fill="#000"/>
  <text x="12" y="5" font-size="22" fill="#fff" dominant-baseline="hanging" font-weight="500">Heizung Übersicht</text>
  <rect x="0" y="32" width="480" height="2" fill="#2A3541"/>
  <!-- Zulauf rot -->
  <polyline points="138,100 299,100" fill="none" stroke="#C2185B" stroke-width="4"/>
  <polyline points="345,58 299,58 299,225" fill="none" stroke="#C2185B" stroke-width="4"/>
  <text x="264" y="85" font-size="12" fill="#FFE0EC" text-anchor="middle" dominant-baseline="hanging">49.8°</text>
  <polyline points="138,168 182,168" fill="none" stroke="#C2185B" stroke-width="4"/>
  <polyline points="218,168 299,168" fill="none" stroke="#C2185B" stroke-width="4"/>
  <!-- Ruecklauf blau -->
  <polyline points="138,252 218,252" fill="none" stroke="#2CA3B8" stroke-width="4"/>
  <text x="178" y="237" font-size="12" fill="#DDF6FA" text-anchor="middle" dominant-baseline="hanging">41.8°</text>
  <polyline points="254,252 276,252" fill="none" stroke="#2CA3B8" stroke-width="4"/>
  <polyline points="324,252 345,252" fill="none" stroke="#2CA3B8" stroke-width="4"/>
  <!-- 3-Wege-Ventil -->
  <g fill="none" stroke="#B0B7BE" stroke-width="2">
    <polygon points="276,239 276,265 300,252"/><polygon points="324,239 324,265 300,252"/><polygon points="288,227 312,227 300,252"/>
    <line x1="300" y1="252" x2="300" y2="279"/><line x1="290" y1="279" x2="310" y2="279" stroke-width="3"/>
  </g>
  <!-- Pumpen -->
  <rect x="182" y="148" width="36" height="40" rx="18" fill="#7A1F1F" stroke="#FF6B5B" stroke-width="3"/>
  <polyline points="208,158 193,168 208,178" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="200" y="108" font-size="16" fill="#FF6B5B" text-anchor="middle" dominant-baseline="hanging" font-weight="600"><tspan x="200">ZP-Gas</tspan><tspan x="200" dy="19">OFF</tspan></text>
  <rect x="218" y="232" width="36" height="40" rx="18" fill="#2E9E3F" stroke="#8BE28F" stroke-width="3"/>
  <polyline points="244,242 229,252 244,262" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="236" y="192" font-size="16" fill="#6FE07F" text-anchor="middle" dominant-baseline="hanging" font-weight="600"><tspan x="236">ZP-Puff</tspan><tspan x="236" dy="19">ON</tspan></text>
  <!-- Heizkoerper -->
  <rect x="28" y="96" width="110" height="8" rx="4" fill="#8FA3B5"/>
  <rect x="28" y="248" width="110" height="8" rx="4" fill="#8FA3B5"/>
  <g fill="#2A3541" stroke="#8FA3B5">
    <rect x="33" y="104" width="10" height="144" rx="5"/><rect x="48" y="104" width="10" height="144" rx="5"/><rect x="63" y="104" width="10" height="144" rx="5"/><rect x="78" y="104" width="10" height="144" rx="5"/><rect x="93" y="104" width="10" height="144" rx="5"/><rect x="108" y="104" width="10" height="144" rx="5"/><rect x="123" y="104" width="10" height="144" rx="5"/>
  </g>
  <text x="48" y="292" font-size="16" fill="#8FA3B5" dominant-baseline="hanging">Heizung</text>
  <!-- Pufferspeicher -->
  <rect x="340" y="36" width="130" height="250" rx="16" fill="#1E2630" stroke="#3A4652" stroke-width="2"/>
  <rect x="348" y="44" width="110" height="230" rx="10" fill="url(#puffer)"/>
  <text x="403" y="58" font-size="14" fill="#FFE0EC" text-anchor="middle" dominant-baseline="hanging">OBEN</text>
  <text x="403" y="78" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600">46.8 °C</text>
  <text x="403" y="214" font-size="14" fill="#DDF6FA" text-anchor="middle" dominant-baseline="hanging">UNTEN</text>
  <text x="403" y="234" font-size="24" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600">45.3 °C</text>
  <text x="352" y="292" font-size="16" fill="#8FA3B5" dominant-baseline="hanging">Pufferspeicher</text>
