          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - lambda: |-
                lv_disp_trig_activity(NULL);

# ---------- Ton (ES8311 + Lautsprecher) ----------
audio_dac:
  - platform: es8311
    id: codec
    i2c_id: i2c_bus
    address: 0x18

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO13
    i2s_mclk_pin: GPIO12

speaker:
  - platform: i2s_audio
    id: lautsprecher
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO16
    audio_dac: codec
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    timeout: never

# Verstaerker (PA) ueber den Erweiterungs-Chip
switch:
  - platform: gpio
    id: verstaerker
    pin:
      pca9554: p_c_a
      number: 7
    restore_mode: ALWAYS_ON

script:
  # Seitenpunkte unten: aktive Seite orange
  - id: set_dots
    parameters:
      p: int
    then:
      - lambda: |-
          lv_obj_t *dots[5] = {dot_1, dot_2, dot_3, dot_4, dot_5};
          for (int i = 0; i < 5; i++) {
            lv_obj_set_style_bg_color(dots[i], i == p ? lv_color_hex(0xFF8A3D) : lv_color_hex(0x3A4652), 0);
          }

sensor:
  - platform: homeassistant
    id: temp_ofen
    entity_id: sensor.temperaturfuehler_puffer_2_temperaturfuehler_puffer_ofen2_temperatur_ch1
    on_value:
      then:
        - lambda: |-
            char buf[24];
            if (std::isnan(x)) {
              snprintf(buf, sizeof(buf), "--.- °C");
            } else {
              snprintf(buf, sizeof(buf), "%.1f °C", x);
            }
            lv_label_set_text(wert_ofen, buf);
            // Pumpe laeuft, solange der Ofen ueber 50 Grad hat
            bool pumpe_an = !std::isnan(x) && x > 50.0f;
            if (pumpe_an) {
              lv_obj_set_style_bg_color(pumpe_kreis, lv_color_hex(0x2E9E3F), 0);
              lv_obj_set_style_border_color(pumpe_kreis, lv_color_hex(0x8BE28F), 0);
              lv_label_set_text(pumpe_status, "ON");
              lv_obj_set_style_text_color(pumpe_status, lv_color_hex(0x6FE07F), 0);
            } else {
              lv_obj_set_style_bg_color(pumpe_kreis, lv_color_hex(0x1E2630), 0);
              lv_obj_set_style_border_color(pumpe_kreis, lv_color_hex(0x78909C), 0);
              lv_label_set_text(pumpe_status, "OFF");
              lv_obj_set_style_text_color(pumpe_status, lv_color_hex(0x78909C), 0);
            }

