    entity_id: sensor.warmepumpe_leistung
    on_value:
      then:
        - lambda: |-
            char buf[24];
            if (std::isnan(x)) {
              snprintf(buf, sizeof(buf), "-- W");
            } else {
              snprintf(buf, sizeof(buf), "%.0f W", x);
            }
            lv_label_set_text(wert_leistung, buf);
            // BWWP laeuft wirklich, wenn sie zwischen 60 und 900 W zieht
            // (eingeschaltet allein heisst nur Bereitschaft, ca. 4 W)
            bool laeuft = !std::isnan(x) && x > 60.0f && x < 900.0f;
            if (laeuft) {
              lv_obj_set_style_bg_color(wp_lauf_kasten, lv_color_hex(0x2E9E3F), 0);
              lv_obj_set_style_border_color(wp_lauf_kasten, lv_color_hex(0x8BE28F), 0);
              lv_label_set_text(wp_lauf_label, LV_SYMBOL_REFRESH " BETRIEB");
              lv_obj_set_style_text_color(wp_lauf_label, lv_color_hex(0xFFFFFF), 0);
            } else {
              lv_obj_set_style_bg_color(wp_lauf_kasten, lv_color_hex(0x7A1F1F), 0);
              lv_obj_set_style_border_color(wp_lauf_kasten, lv_color_hex(0xFF6B5B), 0);
              lv_label_set_text(wp_lauf_label, LV_SYMBOL_PAUSE " STEHT");
              lv_obj_set_style_text_color(wp_lauf_label, lv_color_hex(0xFFFFFF), 0);
            }

