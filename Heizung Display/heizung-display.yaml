text_sensor:
  - platform: homeassistant
    id: wr_zustand_entity
    entity_id: sensor.multiplus_ii_1_wechselrichterzustand
    on_value:
      then:
        - lambda: |-
            std::string v = x;
            bool ok = !(v.empty() || v == "unknown" || v == "unavailable");
            std::string t = ok ? ("WR: " + v) : std::string("WR: --");
            lv_label_set_text(wr_zustand, t.c_str());
            lv_obj_set_style_text_color(wr_zustand, lv_color_hex(ok ? 0x6FE07F : 0x78909C), 0);
  - platform: homeassistant
    id: zp_puff_entity
    entity_id: switch.keller_shelly_mit_addon_heizung_fur_zirkulation
    on_value:
      then:
        - lambda: |-
            lv_color_t k_bg, k_rand, k_txt;
            const char *txt;
            if (x == "on") {
              k_bg = lv_color_hex(0x2E9E3F); k_rand = lv_color_hex(0x8BE28F); k_txt = lv_color_hex(0x6FE07F);
              txt = "ZP-Puff\nON";
            } else if (x == "off") {
              k_bg = lv_color_hex(0x7A1F1F); k_rand = lv_color_hex(0xFF6B5B); k_txt = lv_color_hex(0xFF6B5B);
