font:
  - file: "gfonts://Roboto"
    id: font_titel
    size: 22
    glyphs: " OfenHizugÜbrschtWämpSolaAk"

lvgl:
  displays:
    - my_display

  touchscreens:
    - touchscreen_id: my_touch

  rotation: 90

  # Nach 30 s ohne Beruehrung: Beleuchtung aus und LVGL anhalten
  on_idle:
    timeout: 30s
    then:
      - light.turn_off: display_backlight
      - lvgl.pause:

  theme:
    dark_mode: true
    label:
      text_color: 0xFFFFFF

  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER

  text_color: 0xFFFFFF

  # Liegt ueber allen Seiten: Touch-Zonen zum Blaettern + Seitenpunkte
  top_layer:
    widgets:
      - obj:
          id: dot_1
          x: 204
          y: 306
          width: 8
          height: 8
          radius: 4
          bg_color: 0xFF8A3D
          bg_opa: COVER
          border_width: 0
          clickable: false
      - obj:
          id: dot_2
          x: 220
          y: 306
          width: 8
          height: 8
          radius: 4
          bg_color: 0x3A4652
          bg_opa: COVER
          border_width: 0
          clickable: false
      - obj:
          id: dot_3
          x: 236
          y: 306
          width: 8
          height: 8
          radius: 4
          bg_color: 0x3A4652
          bg_opa: COVER
          border_width: 0
          clickable: false
      - obj:
          id: dot_4
          x: 252
          y: 306
          width: 8
          height: 8
          radius: 4
          bg_color: 0x3A4652
          bg_opa: COVER
          border_width: 0
          clickable: false
      - obj:
          id: dot_5
          x: 268
          y: 306
          width: 8
          height: 8
          radius: 4
          bg_color: 0x3A4652
          bg_opa: COVER
          border_width: 0
          clickable: false

  pages:
    # =================== Seite 1: Anlagenschema ===================
    - id: seite_1
      bg_color: 0x000000
      bg_opa: COVER
      on_load:
        - script.execute:
            id: set_dots
            p: 0
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 320
            bg_color: 0x000000
            bg_opa: COVER
            radius: 0
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
        # ----- Blaettern: links tippen = zurueck, rechts tippen = weiter -----
        - obj:
            x: 0
            y: 0
            width: 240
            height: 320
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click:
              - lvgl.page.previous:
                  animation: MOVE_RIGHT
                  time: 250ms
        - obj:
            x: 240
            y: 0
            width: 240
            height: 320
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click:
              - lvgl.page.next:
                  animation: MOVE_LEFT
                  time: 250ms
        # ----- Titel -----
        - label:
            x: 12
            y: 5
            text: "Ofen Übersicht"
            text_font: font_titel
            text_color: 0xFFFFFF
        - obj:
            x: 0
            y: 32
            width: 480
            height: 2
            bg_color: 0x2A3541
            bg_opa: COVER
            radius: 0
            border_width: 0
            clickable: false

        # ----- Vorlauf (rot) -----
        - line:
            points:
              - 150, 110
              - 299, 110
            line_width: 4
            line_color: 0xC2185B
        - line:
            points:
              - 345, 58
              - 299, 58
              - 299, 213
            line_width: 4
            line_color: 0xC2185B
        # ----- Ruecklauf (blau) -----
        - line:
            points:
              - 150, 240
              - 182, 240
            line_width: 4
            line_color: 0x2CA3B8
        - line:
            points:
              - 218, 240
              - 276, 240
            line_width: 4
            line_color: 0x2CA3B8
        - line:
            points:
              - 324, 240
              - 345, 240
