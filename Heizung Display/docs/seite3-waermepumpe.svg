  <text x="98" y="128" font-size="16" fill="#FF6B5B" text-anchor="middle" dominant-baseline="hanging" font-weight="600"><tspan x="98">ZP-BW</tspan><tspan x="98" dy="19">OFF</tspan></text>
  <!-- Stecker mit Leistung -->
  <rect x="54" y="36" width="4" height="10" rx="1" fill="#B0B7BE"/><rect x="70" y="36" width="4" height="10" rx="1" fill="#B0B7BE"/>
  <rect x="46" y="46" width="36" height="30" rx="6" fill="#2A3541" stroke="#8FA3B5"/>
  <polyline points="64,76 64,98 170,98" fill="none" stroke="#B0B7BE" stroke-width="2"/>
  <text x="90" y="50" font-size="18" fill="#FFD54F" dominant-baseline="hanging" font-weight="600">440 W</text>
