  <line x1="310" y1="54" x2="380" y2="54" stroke="#4A8BD9" stroke-width="10"/>
  <polyline points="324,48 316,54 324,60" fill="none" stroke="#fff" stroke-width="2"/>
  <line x1="310" y1="92" x2="380" y2="92" stroke="#8FA3B5" stroke-width="10"/>
  <polyline points="366,86 374,92 366,98" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="386" y="38" font-size="12" fill="#8FA3B5" dominant-baseline="hanging">ZULUFT</text>
  <text x="386" y="52" font-size="18" fill="#fff" dominant-baseline="hanging" font-weight="600">12.4 °C</text>
  <text x="386" y="76" font-size="12" fill="#8FA3B5" dominant-baseline="hanging">ABLUFT</text>
  <text x="386" y="90" font-size="18" fill="#fff" dominant-baseline="hanging" font-weight="600">8.1 °C</text>
  <!-- Seitenpunkte -->
  <g><rect x="204" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="220" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="236" y="306" width="8" height="8" rx="4" fill="#FF8A3D"/><rect x="252" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="268" y="306" width="8" height="8" rx="4" fill="#3A4652"/></g>
