  <rect x="190" y="98" width="100" height="22" rx="11" fill="#2E9E3F" stroke="#8BE28F" stroke-width="2"/>
  <text x="240" y="104" font-size="12" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600">↻ BETRIEB</text>
  <text x="240" y="142" font-size="14" fill="#8FA3B5" text-anchor="middle" dominant-baseline="hanging">WASSER</text>
  <text x="240" y="162" font-size="28" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600">44.5 °C</text>
