  <rect x="364" y="120" width="56" height="56" rx="10" fill="#7A1F1F" stroke="#FF6B5B" stroke-width="3"/>
  <text x="392" y="131" font-size="16" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600"><tspan x="392">STAB</tspan><tspan x="392" dy="19">OFF</tspan></text>
  <!-- Gas -->
  <rect x="364" y="206" width="56" height="56" rx="10" fill="#7A1F1F" stroke="#FF6B5B" stroke-width="3"/>
  <text x="392" y="217" font-size="16" fill="#fff" text-anchor="middle" dominant-baseline="hanging" font-weight="600"><tspan x="392">GAS</tspan><tspan x="392" dy="19">OFF</tspan></text>
