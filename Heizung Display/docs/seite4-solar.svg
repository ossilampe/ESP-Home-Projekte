<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" font-family="Montserrat, Roboto, Arial, sans-serif">
  <rect width="480" height="320" fill="#000"/>
  <text x="12" y="5" font-size="22" fill="#fff" dominant-baseline="hanging" font-weight="500">Solar Übersicht</text>
  <text x="230" y="10" font-size="16" fill="#6FE07F" dominant-baseline="hanging">WR: bulk</text>
  <rect x="0" y="32" width="480" height="2" fill="#2A3541"/>
  <!-- Sonne, Dach, Modul -->
  <circle cx="62" cy="80" r="22" fill="#FFD54F"/>
  <polyline points="130,150 170,52 310,52 350,150 130,150" fill="none" stroke="#8FA3B5" stroke-width="3"/>
  <rect x="180" y="60" width="120" height="80" rx="4" fill="#16324F" stroke="#6EA8D9" stroke-width="2"/>
  <g stroke="#6EA8D9"><line x1="220" y1="62" x2="220" y2="138"/><line x1="260" y1="62" x2="260" y2="138"/><line x1="182" y1="100" x2="298" y2="100"/></g>
  <text x="362" y="52" font-size="14" fill="#8FA3B5" dominant-baseline="hanging">LEISTUNG</text>
  <text x="362" y="70" font-size="24" fill="#FFD54F" dominant-baseline="hanging" font-weight="600">1250 W</text>
  <text x="362" y="104" font-size="14" fill="#8FA3B5" dominant-baseline="hanging">HEUTE</text>
  <text x="362" y="122" font-size="20" fill="#fff" dominant-baseline="hanging" font-weight="600">4.9 kWh</text>
  <!-- Leitungen zu den Wechselrichtern -->
  <g stroke="#FFD54F" stroke-width="3" fill="none">
    <line x1="240" y1="150" x2="240" y2="166"/><line x1="94" y1="166" x2="386" y2="166"/>
    <line x1="94" y1="166" x2="94" y2="182"/><line x1="240" y1="166" x2="240" y2="182"/><line x1="386" y1="166" x2="386" y2="182"/>
  </g>
  <!-- Wechselrichter -->
  <g>
    <rect x="25" y="182" width="138" height="114" rx="12" fill="#1E2630" stroke="#3A4652" stroke-width="2"/>
    <text x="35" y="187" font-size="14" fill="#8FA3B5" dominant-baseline="hanging">WR1</text>
    <text x="35" y="203" font-size="20" fill="#FFD54F" dominant-baseline="hanging" font-weight="600">685 W</text>
    <text x="35" y="230" font-size="14" fill="#6FE07F" dominant-baseline="hanging">Netz 235 V</text>
    <text x="35" y="250" font-size="14" fill="#fff" dominant-baseline="hanging">2.70 A</text>
    <text x="35" y="270" font-size="14" fill="#fff" dominant-baseline="hanging">Ein 694 W</text>
  </g>
  <g>
    <rect x="171" y="182" width="138" height="114" rx="12" fill="#1E2630" stroke="#3A4652" stroke-width="2"/>
    <text x="181" y="187" font-size="14" fill="#8FA3B5" dominant-baseline="hanging">WR2</text>
    <text x="181" y="203" font-size="20" fill="#FFD54F" dominant-baseline="hanging" font-weight="600">25 W</text>
    <text x="181" y="230" font-size="14" fill="#6FE07F" dominant-baseline="hanging">Netz 236 V</text>
    <text x="181" y="250" font-size="14" fill="#fff" dominant-baseline="hanging">0.60 A</text>
    <text x="181" y="270" font-size="14" fill="#fff" dominant-baseline="hanging">Ein 29 W</text>
  </g>
  <g>
    <rect x="317" y="182" width="138" height="114" rx="12" fill="#1E2630" stroke="#3A4652" stroke-width="2"/>
    <text x="327" y="187" font-size="14" fill="#8FA3B5" dominant-baseline="hanging">WR3</text>
    <text x="327" y="203" font-size="20" fill="#FFD54F" dominant-baseline="hanging" font-weight="600">13 W</text>
    <text x="327" y="230" font-size="14" fill="#6FE07F" dominant-baseline="hanging">Netz 237 V</text>
    <text x="327" y="250" font-size="14" fill="#fff" dominant-baseline="hanging">0.50 A</text>
    <text x="327" y="270" font-size="14" fill="#fff" dominant-baseline="hanging">Ein 18 W</text>
  </g>
  <!-- Seitenpunkte -->
  <g><rect x="204" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="220" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="236" y="306" width="8" height="8" rx="4" fill="#3A4652"/><rect x="252" y="306" width="8" height="8" rx="4" fill="#FF8A3D"/><rect x="268" y="306" width="8" height="8" rx="4" fill="#3A4652"/></g>
